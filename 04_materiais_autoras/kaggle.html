    <script nonce="bLqILrwtKhdfOP6n+RlGpQ==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"BrScamsFacebook","description":"# BrScamsFacebook\n\n**450 mensagens de golpes digitais reais em português brasileiro, rotuladas manualmente em\n6 categorias, com distribuição perfeitamente balanceada (75 por categoria).**\n\nA detecção de fraudes em redes sociais em português enfrenta um obstáculo prático: quase\ntodos os datasets públicos de *scam* e *phishing* estão em inglês, e modelos treinados neles\nnão transferem bem para o contexto brasileiro — mudam as gírias, os valores em reais, as\ninstituições invocadas (Receita Federal, PIX, Correios) e as construções de urgência. O\nBrScamsFacebook foi construído para preencher essa lacuna, combinando coleta autoral no\nFacebook com material consolidado de seis fontes externas.\n\nO dataset foi criado para calibrar o **VeritaPlugin**, uma extensão de navegador que detecta\nfraudes no Facebook e apresenta ao usuário a categoria do golpe, o enquadramento legal\naplicável e as ações recomendadas.\n\n## Estrutura\n\nArquivo único, 450 linhas, 3 colunas.\n\n| Coluna | Tipo | Descrição |\n|---|---|---|\n| `Mensagem` | texto | Conteúdo textual da publicação ou mensagem |\n| `Categoria` | categórica (6) | Rótulo do tipo de golpe, ou `Seguro` para conteúdo legítimo |\n| `Dataset` | categórica (8) | Origem da instância — `Interno` ou `Externo 1` a `Externo 7` |\n\nComprimento das mensagens: mínimo 21 caracteres, mediana 151, média 292, máximo 4.041.\n\n## Categorias\n\n| Categoria | Instâncias | Descrição |\n|---|---|---|\n| Golpes Baseados Em Relacionamento | 75 | Manipulação emocional para obtenção de vantagem |\n| Golpes de Ganho Financeiro Ilusório | 75 | Promessas falsas de dinheiro fácil ou prêmios |\n| Ataques de Phishing e Roubo de Dados | 75 | Coleta indevida de dados pessoais |\n| Fraudes em Lojas Virtuais Falsas | 75 | Lojas online fraudulentas e avaliações plantadas |\n| Golpes de Desinformação Digital | 75 | Notícias falsas com fins maliciosos |\n| Seguro | 75 | Conteúdo legítimo — classe negativa |\n\nA classe `Seguro` é essencial: sem ela, um classificador aprenderia apenas a distinguir\n*tipos* de golpe, e não a distinguir golpe de conteúdo normal — que é o problema real.\n\n## Procedência\n\nA coluna `Dataset` permite rastrear cada instância até sua origem, o que é necessário tanto\npara auditoria quanto para a estratificação descrita em *Limitações*.\n\n| Origem | Instâncias | Fonte |\n|---|---|---|\n| `Interno` | 64 | Coleta autoral no Facebook, via personas de observação (posts, comentários e anúncios) |\n| `Externo 1` | 65 | Fórum ScamWarners — golpes de relacionamento (traduzido do inglês) |\n| `Externo 2` | 77 | SMS Spam Collection (traduzido do inglês) |\n| `Externo 3` | 104 | Fake News em português — base nativa, sem tradução |\n| `Externo 4` | 36 | *sec-fraudimabr* (Nascimento et al., 2023) — WhatsApp e Telegram, nativo em português |\n| `Externo 5` | 25 | Fórum ScamWarners — golpes financeiros (traduzido do inglês) |\n| `Externo 6` | 43 | Fake Reviews Dataset (traduzido do inglês) |\n| `Externo 7` | 36 | Fórum ScamWarners — lojas falsas (traduzido do inglês) |\n\nO código de coleta, tradução e consolidação de cada fonte está publicado:\n[scraping-scamwarners](https://github.com/brunanoroes/scraping-scamwarners) ·\n[tradutor-dataset-phishing](https://github.com/brunanoroes/tradutor-dataset-phishing) ·\n[extrator-dataset-processed_texts](https://github.com/brunanoroes/extrator-dataset-processed_texts) ·\n[tratamento-dados-golpes-lojas-falsas](https://github.com/brunanoroes/tratamento-dados-golpes-lojas-falsas)\n\n## Resultado de referência\n\nUm BERTimbau (`neuralmind/bert-base-portuguese-cased`) ajustado sobre este dataset atinge\n**F1-macro de 0,763 ± 0,034** em validação cruzada estratificada com k = 5. Sob protocolo e\nsemente idênticos:\n\n| Modelo | F1-macro |\n|---|---|\n| Classificador por maioria | 0,048 |\n| TF-IDF + LinearSVC | 0,711 ± 0,027 |\n| BERTimbau *fine-tuned* | **0,763 ± 0,034** |\n\nO modelo treinado está disponível em\n[huggingface.co/brunanoroes/veritaplugin-bert](https://huggingface.co/brunanoroes/veritaplugin-bert),\ne o código de treinamento e avaliação em\n[treinamento-BERTimbau](https://github.com/brunanoroes/treinamento-BERTimbau).\n\nNote que o ganho do modelo neural sobre o baseline clássico é modesto (+0,052) e que os\nintervalos de ±1 desvio padrão se sobrepõem marginalmente. **TF-IDF + SVM é um baseline\nforte nesta tarefa** — quem usar este dataset deve compará-lo com esse baseline, e não\napenas com um classificador trivial.\n\n## Limitações\n\nLeia esta seção antes de usar o dataset. Elas são consequência do modo como ele foi\nconstruído e afetam diretamente a interpretação de qualquer resultado obtido aqui.\n\n**1. Categoria e origem são quase colineares.** Esta é a limitação mais importante. O\ncruzamento entre `Categoria` e `Dataset` mostra que cada categoria vem majoritariamente de\numa ou duas fontes:\n\n| Categoria | Composição predominante |\n|---|---|\n| Golpes Baseados Em Relacionamento | 65 de `Externo 1` + 10 `Interno` |\n| ...","url":"https://www.kaggle.com/brunaassisgt/brscamsfacebook","version":1,"keywords":["analysis, nlp","subject, science and technology, internet, online communities, social networks","task, text-classification","language, portuguese"],"license":{"@type":"CreativeWork","name":"MIT","url":"https://www.mit.edu/~amini/LICENSE.md"},"identifier":["10068504"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"Bruna Assisgt","url":"https://www.kaggle.com/brunaassisgt","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/default-thumb.png"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/brunaassisgt/brscamsfacebook/download?datasetVersionNumber=1","contentSize":"71274 bytes"}],"commentCount":0,"dateModified":"2026-04-13T17:11:47.547Z","discussionUrl":"https://www.kaggle.com/brunaassisgt/brscamsfacebook/discussion","alternateName":"450 golpes digitais reais em português brasileiro, rotulados em 6 categorias","isAccessibleForFree":true,"thumbnailUrl":"https://storage.googleapis.com/kaggle-datasets-images/new-version-temp-images/default-backgrounds-36.png-27420398/dataset-card.png","interactionStatistic":[{"@type":"InteractionCounter","interactionType":"http://schema.org/CommentAction","userInteractionCount":0},{"@type":"InteractionCounter","interactionType":"http://schema.org/DownloadAction","userInteractionCount":46},{"@type":"InteractionCounter","interactionType":"http://schema.org/ViewAction","userInteractionCount":297},{"@type":"InteractionCounter","interactionType":"http://schema.org/LikeAction","userInteractionCount":0}]}</script>
